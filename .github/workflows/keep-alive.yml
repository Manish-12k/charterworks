name: Keep Supabase project awake

# Supabase's free tier pauses a project after 7 days with no API traffic.
# This just pings the REST endpoint every 3 days so a live site never
# goes dark. Runs on GitHub's free Actions minutes — no cost either way.

on:
  schedule:
    - cron: '0 6 */3 * *' # 06:00 UTC, every 3 days
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST endpoint
        run: |
          curl -sf "${{ secrets.SUPABASE_URL }}/rest/v1/services?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            > /dev/null
